      - name: Android projesini hazırla
        shell: bash
        run: |
          set -e

          cd "$PROJECT_DIR"

          if [ -d android ]; then
            echo "Android klasörü mevcut."
          else
            echo "Android klasörü yok."
            echo "Flutter Android projesini oluşturuyor..."
            flutter create --platforms=android --project-name=wxtra .
          fi

          echo "Android projesi kontrol ediliyor..."

          if [ -f android/settings.gradle ]; then
            echo "settings.gradle bulundu."
          else
            echo "HATA: android/settings.gradle bulunamadı!"
            exit 1
          fi

          if [ -f android/app/build.gradle ]; then
            echo "Android Gradle yapılandırması bulundu."
          else
            echo "HATA: android/app/build.gradle bulunamadı!"
            exit 1
          fi

          echo "Android projesi hazır."
