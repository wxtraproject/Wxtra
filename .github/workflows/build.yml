name: WXTRA APK

on:
  workflow_dispatch:
  push:
    branches:
      - main
      - master

jobs:
  APK:
    runs-on: ubuntu-latest

    steps:
      - name: Projeyi indir
        uses: actions/checkout@v4

      - name: Java 17 kur
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "17"

      - name: Gradle kur
        uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: "8.7"

      - name: Gradle projesini bul
        shell: bash
        run: |
          echo "GitHub proje içeriği:"
          find . -maxdepth 4 -type f | sort

          PROJECT_DIR=""

          for FILE in $(find . -type f -name "settings.gradle" -print); do
            PROJECT_DIR=$(dirname "$FILE")
            break
          done

          if [ -z "$PROJECT_DIR" ]; then
            for FILE in $(find . -type f -name "settings.gradle.kts" -print); do
              PROJECT_DIR=$(dirname "$FILE")
              break
            done
          fi

          if [ -z "$PROJECT_DIR" ]; then
            echo "HATA: settings.gradle bulunamadı!"
            exit 1
          fi

          echo "Gradle proje klasörü: $PROJECT_DIR"
          echo "PROJECT_DIR=$PROJECT_DIR" >> "$GITHUB_ENV"

      - name: APK oluştur
        shell: bash
        run: |
          cd "$PROJECT_DIR"
          gradle assembleDebug --stacktrace

      - name: APK'yı yükle
        uses: actions/upload-artifact@v4
        with:
          name: WXTRA-APK
          path: "**/app/build/outputs/apk/debug/*.apk"
          if-no-files-found: error
