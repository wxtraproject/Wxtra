name: WXTRA APK

on:
  workflow_dispatch:
  push:
    branches:
      - main
      - master

permissions:
  contents: read

jobs:
  APK:
    runs-on: ubuntu-latest

    steps:
      - name: Projeyi indir
        uses: actions/checkout@v4

      - name: Java 17 kur
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "17"

      - name: Flutter kur
        uses: subosito/flutter-action@v2
        with:
          channel: stable
          cache: true

      - name: ZIP'i aç
        shell: bash
        run: |
          set -euo pipefail

          rm -rf project
          mkdir -p project

          unzip -q wxtra.zip -d project

          echo "ZIP içeriği:"
          find project -maxdepth 4 -type f | sort

      - name: Flutter projesini bul
        shell: bash
        run: |
          set -euo pipefail

          PUBSPEC=$(find project -type f -name "pubspec.yaml" -print -quit)

          if [ -z "$PUBSPEC" ]; then
            echo "HATA: pubspec.yaml bulunamadı!"
            exit 1
          fi

          PROJECT_DIR=$(dirname "$PUBSPEC")

          echo "Flutter proje klasörü: $PROJECT_DIR"
          echo "PROJECT_DIR=$PROJECT_DIR" >> "$GITHUB_ENV"

      - name: Android projesini hazırla
        shell: bash
        run: |
          set -euo pipefail

          cd "$PROJECT_DIR"

          if [ ! -f "android/settings.gradle" ] &&
             [ ! -f "android/settings.gradle.kts
